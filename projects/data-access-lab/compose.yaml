services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: data_access_lab
      POSTGRES_USER: data_access_lab
      POSTGRES_PASSWORD: ${DATA_ACCESS_LAB_DB_PASSWORD:?Set DATA_ACCESS_LAB_DB_PASSWORD in a local .env file}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - data_access_lab_pg:/var/lib/postgresql/data

volumes:
  data_access_lab_pg:
